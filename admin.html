function setLang(lang){
  currentLang = lang;
  const html = document.getElementById("htmlRoot");
  html.setAttribute("lang", lang);
  html.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (translations[key]) el.textContent = translations[key][lang];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const key = el.getAttribute("data-i18n-ph");
    if (translations[key]) el.setAttribute("placeholder", translations[key][lang]);
  });
  document.querySelectorAll(".lang-switch button, .login-lang button").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
  });
}

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    logout();
  } else {
    showDashboard();
  }
}

async function login(){
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPass").value;

  const { data: userRow, error: lookupError } = await sb.from("staff_roles").select("email").eq("username", username).maybeSingle();
  if (lookupError || !userRow){ document.getElementById("loginError").style.display = "block"; return; }

  const { error } = await sb.auth.signInWithPassword({ email: userRow.email, password });
  if (error){ document.getElementById("loginError").style.display = "block"; return; }
  showDashboard();
}

async function logout(){
  await sb.auth.signOut();
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
}

async function loadUserRole(){
  const { data: userData } = await sb.auth.getUser();
  const email = userData?.user?.email;
  if (!email) return;
  const { data, error } = await sb.from("staff_roles").select("*").eq("email", email).maybeSingle();
  currentUserRole = (!error && data) ? data.role : "staff";
  document.getElementById("roleTag").textContent = currentUserRole === "owner" ? translations.roleOwner[currentLang] : translations.roleStaff[currentLang];

  const perms = (!error && data) ? data : { can_manage_categories:false, can_manage_currency:false, can_manage_settings:false, can_delete_data:false };
  currentUserPerms = perms;
  document.getElementById("tabSettingsBtn").style.display = (perms.can_manage_settings || currentUserRole === "owner") ? "inline-block" : "none";
  document.getElementById("categoryManagerBox").style.display = perms.can_manage_categories ? "block" : "none";
  document.getElementById("tabHomeBtn").style.display = "inline-block";
  document.getElementById("subTabRolesBtn").style.display = currentUserRole === "owner" ? "inline-block" : "none";
  document.getElementById("subTabDangerBtn").style.display = perms.can_delete_data ? "inline-block" : "none";
}

function showDashboard(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadUserRole();
  renderStatusHeaderFilter();
  loadCategories();
  loadCurrencies();
  loadProducts();
  loadOrders();
  loadVisits();
  loadRoles();
  loadHomeTab();
  initRealtimeSubscriptions();
}

function initRealtimeSubscriptions(){
  sb.channel('public-db-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, payload => {
      loadProducts();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
      loadOrders();
      showToast(translations.newOrderToast ? translations.newOrderToast[currentLang] : "Database updated!");
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, payload => {
      loadCategories();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'currencies' }, payload => {
      loadCurrencies();
    })
    .subscribe();
}

function showToast(text){
  const t = document.getElementById("toast");
  document.getElementById("toastText").textContent = text;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function switchTab(tab){
  ["home","products","orders","reports","customers","settings"].forEach(t => {
    document.getElementById(t+"Panel").style.display = t === tab ? "block" : "none";
  });
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("tab"+tab.charAt(0).toUpperCase()+tab.slice(1)+"Btn");
  if (btn) btn.classList.add("active");
  if (tab === "reports") renderReports();
  if (tab === "customers") renderCustomers();
  if (tab === "home") loadHomeTab();
  if (tab === "orders") document.getElementById("bellBadge").style.display = "none";
}

async function loadVisits(){
  const { count, error } = await sb.from("site_visits").select("*", { count: "exact", head: true });
  document.getElementById("statVisits").textContent = error ? "-" : count;
}

window.onload = function() {
  checkSession();
};
