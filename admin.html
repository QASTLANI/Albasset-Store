<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Admin Dashboard | Albaseet Soft Gambia</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;600;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy-950:#0b1730; --navy-900:#0e2148; --gold-500:#f0a530;
    --ink:#1a2438; --muted:#5b6478; --paper:#f6f8fc; --line:#e4e9f2;
    --f-body:'Tajawal','Cairo',sans-serif;
  }
  html[lang="en"]{ --f-body:'Poppins',sans-serif; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{overflow-x:hidden;}
  body{font-family:var(--f-body); color:var(--ink); background:var(--paper); overflow-x:hidden;}
  .wrap{max-width:1150px; margin:0 auto; padding:24px;}

  /* Login */
  #loginScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy-950); position:relative; }
  .login-lang{ position:absolute; top:20px; right:20px; display:flex; background:rgba(255,255,255,.08); border-radius:20px; padding:3px; gap:2px; }
  html[dir="rtl"] .login-lang{ right:auto; left:20px; }
  .login-lang button{ border:none; background:transparent; color:#cfd9ef; font-weight:800; font-size:12px; padding:6px 12px; border-radius:16px; cursor:pointer; }
  .login-lang button.active{ background:var(--gold-500); color:var(--navy-950); }
  .login-box{ background:#fff; padding:40px; border-radius:16px; width:340px; text-align:center; }
  .login-box img{ width:60px; margin-bottom:14px; }
  .login-box input{ width:100%; padding:12px; margin-bottom:12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  .login-box button.login-submit{ width:100%; padding:12px; background:var(--gold-500); border:none; border-radius:8px; font-weight:800; cursor:pointer; color:var(--navy-950); }
  .login-error{ color:#e74c3c; font-size:13px; margin-top:8px; display:none; }

  /* Dashboard */
  #dashboard{ display:none; }
  header{ background:var(--navy-950); color:#fff; padding:16px 0; }
  .header-row{ max-width:1150px; margin:0 auto; padding:0 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .header-actions{ display:flex; align-items:center; gap:12px; }
  .lang-switch{ display:flex; background:rgba(255,255,255,.08); border-radius:20px; padding:3px; gap:2px; }
  .lang-switch button{ border:none; background:transparent; color:#cfd9ef; font-weight:800; font-size:12px; padding:6px 12px; border-radius:16px; cursor:pointer; }
  .lang-switch button.active{ background:var(--gold-500); color:var(--navy-950); }
  .logout-btn{ background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff; padding:8px 16px; border-radius:6px; cursor:pointer; }

  .stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:24px 0; }
  .stat-card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; text-align:center; }
  .stat-card b{ display:block; font-size:26px; color:var(--navy-950); }
  .stat-card span{ font-size:12.5px; color:var(--muted); }

  .tabs{ display:flex; gap:10px; margin-bottom:20px; }
  .tab-btn{ padding:10px 20px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:700; }
  .tab-btn.active{ background:var(--navy-900); color:#fff; }

  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; }
  th, td{ padding:12px 14px; text-align:start; border-bottom:1px solid var(--line); font-size:13.5px; }
  th{ background:var(--paper); font-weight:800; }
  input.edit-field, select.edit-field{ width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:5px; font-family:inherit; font-size:13px; }
  .img-preview{ width:44px; height:44px; border-radius:6px; object-fit:cover; background:var(--paper); }
  .save-btn{ background:#2ecc71; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12.5px; }
  .del-btn{ background:#e74c3c; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12.5px; }

  .add-product-box{ background:#fff; padding:20px; border-radius:10px; margin-bottom:20px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .add-product-box input, .add-product-box textarea{ padding:9px; border:1px solid var(--line); border-radius:7px; font-family:inherit; }
  .add-product-box button{ grid-column:span 3; background:var(--navy-900); color:#fff; border:none; padding:11px; border-radius:7px; cursor:pointer; font-weight:700; }
  .status-select{ padding:5px; border-radius:5px; border:1px solid var(--line); }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-lang">
    <button type="button" data-lang="ar" onclick="setLang('ar')">AR</button>
    <button type="button" class="active" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
  <div class="login-box">
    <img src="logo.png" alt="logo">
    <h3 style="margin-bottom:18px;" data-i18n="loginTitle">Admin Login</h3>
    <input type="email" id="loginEmail" data-i18n-ph="phEmail" placeholder="Email">
    <input type="password" id="loginPass" data-i18n-ph="phPassword" placeholder="Password">
    <button class="login-submit" onclick="login()" data-i18n="loginBtn">Login</button>
    <div class="login-error" id="loginError" data-i18n="loginError">Invalid login credentials</div>
  </div>
</div>

<div id="dashboard">
  <header>
    <div class="header-row">
      <b data-i18n="dashboardTitle">Albaseet Soft Admin Dashboard</b>
      <div class="header-actions">
        <div class="lang-switch">
          <button type="button" data-lang="ar" onclick="setLang('ar')">AR</button>
          <button type="button" class="active" data-lang="en" onclick="setLang('en')">EN</button>
        </div>
        <button class="logout-btn" onclick="logout()" data-i18n="logoutBtn">Log Out</button>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div class="stats-row">
      <div class="stat-card"><b id="statVisits">-</b><span data-i18n="statVisits">Total Store Visits</span></div>
      <div class="stat-card"><b id="statProducts">-</b><span data-i18n="statProducts">Products Listed</span></div>
      <div class="stat-card"><b id="statOrders">-</b><span data-i18n="statOrders">Total Orders</span></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabProductsBtn" onclick="switchTab('products')" data-i18n="tabProducts">Products</button>
      <button class="tab-btn" id="tabOrdersBtn" onclick="switchTab('orders')" data-i18n="tabOrders">Orders</button>
    </div>

    <div id="productsPanel">
      <div class="add-product-box">
        <input type="text" id="newName" data-i18n-ph="phName" placeholder="Product name">
        <input type="number" id="newPrice" data-i18n-ph="phPrice" placeholder="Price ($)">
        <input type="text" id="newCategory" data-i18n-ph="phCategory" placeholder="Category">
        <input type="text" id="newImage" data-i18n-ph="phImage" placeholder="Image URL">
        <input type="number" id="newStock" data-i18n-ph="phStock" placeholder="Stock quantity">
        <textarea id="newDesc" data-i18n-ph="phDesc" placeholder="Description"></textarea>
        <button onclick="addProduct()" data-i18n="addProductBtn">+ Add New Product</button>
      </div>
      <table>
        <thead><tr>
          <th data-i18n="thImage">Image</th>
          <th data-i18n="thName">Name</th>
          <th data-i18n="thPrice">Price</th>
          <th data-i18n="thCategory">Category</th>
          <th data-i18n="thStock">Stock</th>
          <th data-i18n="thInStock">In Stock</th>
          <th></th>
        </tr></thead>
        <tbody id="productsTableBody"></tbody>
      </table>
    </div>

    <div id="ordersPanel" style="display:none;">
      <table>
        <thead><tr>
          <th data-i18n="thCustomer">Customer</th>
          <th data-i18n="thPhone">Phone</th>
          <th data-i18n="thAddress">Address</th>
          <th data-i18n="thItems">Items</th>
          <th data-i18n="thTotal">Total</th>
          <th data-i18n="thPayment">Payment</th>
          <th data-i18n="thStatus">Status</th>
        </tr></thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ipyafdzrxfwsrenbebad.supabase.co";
const SUPABASE_KEY = "sb_publishable_HeWYWc9kfvT6Anp49jRNvw_creK5A10";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentLang = "en";

const translations = {
  loginTitle: {ar:"تسجيل دخول الأدمن", en:"Admin Login"},
  phEmail: {ar:"الإيميل", en:"Email"},
  phPassword: {ar:"كلمة السر", en:"Password"},
  loginBtn: {ar:"دخول", en:"Login"},
  loginError: {ar:"بيانات الدخول غير صحيحة", en:"Invalid login credentials"},
  dashboardTitle: {ar:"لوحة إدارة Albaseet Soft", en:"Albaseet Soft Admin Dashboard"},
  logoutBtn: {ar:"تسجيل خروج", en:"Log Out"},
  statVisits: {ar:"إجمالي زيارات المتجر", en:"Total Store Visits"},
  statProducts: {ar:"عدد المنتجات", en:"Products Listed"},
  statOrders: {ar:"إجمالي الطلبات", en:"Total Orders"},
  tabProducts: {ar:"المنتجات", en:"Products"},
  tabOrders: {ar:"الطلبات", en:"Orders"},
  phName: {ar:"اسم المنتج", en:"Product name"},
  phPrice: {ar:"السعر ($)", en:"Price ($)"},
  phCategory: {ar:"الفئة", en:"Category"},
  phImage: {ar:"رابط الصورة", en:"Image URL"},
  phStock: {ar:"الكمية المتوفرة", en:"Stock quantity"},
  phDesc: {ar:"الوصف", en:"Description"},
  addProductBtn: {ar:"+ إضافة منتج جديد", en:"+ Add New Product"},
  thImage: {ar:"الصورة", en:"Image"},
  thName: {ar:"الاسم", en:"Name"},
  thPrice: {ar:"السعر", en:"Price"},
  thCategory: {ar:"الفئة", en:"Category"},
  thStock: {ar:"الكمية", en:"Stock"},
  thInStock: {ar:"متوفر", en:"In Stock"},
  thCustomer: {ar:"الزبون", en:"Customer"},
  thPhone: {ar:"الهاتف", en:"Phone"},
  thAddress: {ar:"العنوان", en:"Address"},
  thItems: {ar:"المنتجات", en:"Items"},
  thTotal: {ar:"المجموع", en:"Total"},
  thPayment: {ar:"الدفع", en:"Payment"},
  thStatus: {ar:"الحالة", en:"Status"},
  saveBtn: {ar:"حفظ", en:"Save"},
  delBtn: {ar:"حذف", en:"Delete"},
  confirmDelete: {ar:"متأكد إنك بدك تحذف هاد المنتج؟", en:"Are you sure you want to delete this product?"},
  savedMsg: {ar:"تم الحفظ بنجاح", en:"Saved successfully"},
  saveErrorMsg: {ar:"حدث خطأ بالحفظ", en:"Error while saving"},
  fillRequired: {ar:"الرجاء تعبئة الاسم والسعر على الأقل", en:"Please fill in at least the name and price"},
  addErrorMsg: {ar:"حدث خطأ بالإضافة", en:"Error while adding"},
  statusNew: {ar:"جديد", en:"New"},
  statusProcessing: {ar:"جاري التجهيز", en:"Processing"},
  statusDelivered: {ar:"تم التسليم", en:"Delivered"},
  statusCancelled: {ar:"ملغي", en:"Cancelled"}
};

function setLang(lang){
  currentLang = lang;
  const html = document.getElementById("htmlRoot");
  html.setAttribute("lang", lang);
  html.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (translations[key]) el.textContent = translations[key][lang];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const key = el.getAttribute("data-i18n-ph");
    if (translations[key]) el.setAttribute("placeholder", translations[key][lang]);
  });
  document.querySelectorAll(".lang-switch button, .login-lang button").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
  });

  if (document.getElementById("dashboard").style.display === "block"){
    loadProducts();
    loadOrders();
  }
}

async function checkSession(){
  const { data } = await sb.auth.getSession();
  if (data.session) showDashboard();
}

async function login(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPass").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ document.getElementById("loginError").style.display = "block"; return; }
  showDashboard();
}

async function logout(){
  await sb.auth.signOut();
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
}

function showDashboard(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadProducts();
  loadOrders();
  loadVisits();
}

function switchTab(tab){
  document.getElementById("productsPanel").style.display = tab === "products" ? "block" : "none";
  document.getElementById("ordersPanel").style.display = tab === "orders" ? "block" : "none";
  document.getElementById("tabProductsBtn").classList.toggle("active", tab === "products");
  document.getElementById("tabOrdersBtn").classList.toggle("active", tab === "orders");
}

async function loadVisits(){
  const { count, error } = await sb.from("site_visits").select("*", { count: "exact", head: true });
  document.getElementById("statVisits").textContent = error ? "-" : count;
}

async function loadProducts(){
  const { data, error } = await sb.from("products").select("*").order("id");
  if (error) return;
  document.getElementById("statProducts").textContent = data.length;
  const body = document.getElementById("productsTableBody");
  body.innerHTML = data.map(p => `
    <tr>
      <td>
        <img class="img-preview" src="${p.image_url || ''}" onerror="this.style.opacity=0.2">
        <input class="edit-field" style="margin-top:4px;" value="${p.image_url || ''}" id="img-${p.id}">
      </td>
      <td><input class="edit-field" value="${p.name || ''}" id="name-${p.id}"></td>
      <td><input class="edit-field" type="number" value="${p.price || 0}" id="price-${p.id}"></td>
      <td><input class="edit-field" value="${p.category || ''}" id="cat-${p.id}"></td>
      <td><input class="edit-field" type="number" value="${p.stock || 0}" id="stock-${p.id}"></td>
      <td>
        <select class="edit-field" id="instock-${p.id}">
          <option value="true" ${p.in_stock ? 'selected' : ''}>${translations.thInStock[currentLang]}: Yes</option>
          <option value="false" ${!p.in_stock ? 'selected' : ''}>${translations.thInStock[currentLang]}: No</option>
        </select>
      </td>
      <td style="display:flex; gap:6px;">
        <button class="save-btn" onclick="saveProduct(${p.id})">${translations.saveBtn[currentLang]}</button>
        <button class="del-btn" onclick="deleteProduct(${p.id})">${translations.delBtn[currentLang]}</button>
      </td>
    </tr>
  `).join("");
}

async function saveProduct(id){
  const name = document.getElementById(`name-${id}`).value;
  const price = parseFloat(document.getElementById(`price-${id}`).value);
  const category = document.getElementById(`cat-${id}`).value;
  const stock = parseInt(document.getElementById(`stock-${id}`).value);
  const in_stock = document.getElementById(`instock-${id}`).value === "true";
  const image_url = document.getElementById(`img-${id}`).value.trim();

  const { error } = await sb.from("products").update({ name, price, category, stock, in_stock, image_url }).eq("id", id);
  alert(error ? translations.saveErrorMsg[currentLang] : translations.savedMsg[currentLang]);
  loadProducts();
}

async function deleteProduct(id){
  if (!confirm(translations.confirmDelete[currentLang])) return;
  const { error } = await sb.from("products").delete().eq("id", id);
  if (!error) loadProducts();
}

async function addProduct(){
  const name = document.getElementById("newName").value.trim();
  const price = parseFloat(document.getElementById("newPrice").value);
  const category = document.getElementById("newCategory").value.trim();
  const image_url = document.getElementById("newImage").value.trim();
  const stock = parseInt(document.getElementById("newStock").value) || 0;
  const description = document.getElementById("newDesc").value.trim();

  if (!name || !price){ alert(translations.fillRequired[currentLang]); return; }

  const { error } = await sb.from("products").insert([{
    name, price, category, image_url, stock, description, in_stock: stock > 0
  }]);

  if (error){ alert(translations.addErrorMsg[currentLang]); return; }
  ["newName","newPrice","newCategory","newImage","newStock","newDesc"].forEach(id => document.getElementById(id).value = "");
  loadProducts();
}

async function loadOrders(){
  const { data, error } = await sb.from("orders").select("*").order("id", { ascending: false });
  if (error) return;
  document.getElementById("statOrders").textContent = data.length;
  const body = document.getElementById("ordersTableBody");
  const statusMap = {
    "جديد": translations.statusNew, "New": translations.statusNew,
    "جاري التجهيز": translations.statusProcessing, "Processing": translations.statusProcessing,
    "تم التسليم": translations.statusDelivered, "Delivered": translations.statusDelivered,
    "ملغي": translations.statusCancelled, "Cancelled": translations.statusCancelled
  };
  body.innerHTML = data.map(o => `
    <tr>
      <td>${o.customer_name || ''}</td>
      <td>${o.phone || ''}</td>
      <td>${o.address || ''}</td>
      <td>${o.items || ''}</td>
      <td>$${o.total_price || 0}</td>
      <td>${o.payment_method || ''}</td>
      <td>
        <select class="status-select" onchange="updateStatus(${o.id}, this.value)">
          <option value="جديد" ${o.status==='جديد'||o.status==='New'?'selected':''}>${translations.statusNew[currentLang]}</option>
          <option value="جاري التجهيز" ${o.status==='جاري التجهيز'||o.status==='Processing'?'selected':''}>${translations.statusProcessing[currentLang]}</option>
          <option value="تم التسليم" ${o.status==='تم التسليم'||o.status==='Delivered'?'selected':''}>${translations.statusDelivered[currentLang]}</option>
          <option value="ملغي" ${o.status==='ملغي'||o.status==='Cancelled'?'selected':''}>${translations.statusCancelled[currentLang]}</option>
        </select>
      </td>
    </tr>
  `).join("");
}

async function updateStatus(id, status){
  await sb.from("orders").update({ status }).eq("id", id);
}

checkSession();
</script>
</body>
</html>
