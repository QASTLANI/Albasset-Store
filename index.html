<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">المتجر | Albaseet Soft Gambia</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;600;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy-950:#0b1730; --navy-900:#0e2148; --navy-800:#132c5c;
    --gold-500:#f0a530; --gold-400:#f7c15e; --ink:#1a2438; --muted:#5b6478;
    --paper:#f6f8fc; --line:#e4e9f2; --white:#ffffff;
    --f-body:'Tajawal','Cairo',sans-serif;
  }
  html[lang="en"]{ --f-body:'Poppins',sans-serif; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{overflow-x:hidden;}
  body{font-family:var(--f-body); color:var(--ink); background:var(--paper); overflow-x:hidden;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  header{background:var(--navy-950); color:#fff; padding:16px 0; position:sticky; top:0; z-index:50;}
  .header-row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;}
  .brand{display:flex; align-items:center; gap:12px; font-weight:800; font-size:18px;}
  .brand img{width:42px; height:42px; border-radius:50%;}
  .header-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .back-link{color:#cfd9ef; font-size:13.5px; font-weight:600;}
  .lang-switch{display:flex; background:rgba(255,255,255,.08); border-radius:20px; padding:3px; gap:2px;}
  .lang-switch button{border:none; background:transparent; color:#cfd9ef; font-weight:800; font-size:12px; padding:6px 12px; border-radius:16px; cursor:pointer; font-family:'Poppins',sans-serif;}
  .lang-switch button.active{background:var(--gold-500); color:var(--navy-950);}
  .cart-btn{
    position:relative; background:var(--gold-500); color:var(--navy-950); border:none;
    padding:10px 18px; border-radius:8px; font-weight:800; font-size:14px; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .cart-count{
    position:absolute; top:-8px; left:-8px; background:#e74c3c; color:#fff;
    width:20px; height:20px; border-radius:50%; font-size:11px; display:flex;
    align-items:center; justify-content:center;
  }
  .filters{display:flex; gap:10px; padding:24px 0 8px; flex-wrap:wrap;}
  .filter-btn{
    padding:9px 18px; border-radius:20px; border:1px solid var(--line); background:#fff;
    font-weight:700; font-size:13.5px; cursor:pointer; color:var(--navy-900);
  }
  .filter-btn.active{background:var(--navy-900); color:#fff; border-color:var(--navy-900);}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:22px; padding:24px 0 60px;
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column; transition:.2s;
  }
  .card:hover{box-shadow:0 16px 30px -18px rgba(19,44,92,.3); transform:translateY(-3px);}
  .card-img{
    height:160px; background:var(--paper) center/contain no-repeat; display:flex;
    align-items:center; justify-content:center; color:#b7c0d4; font-size:34px;
  }
  .card-body{padding:16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .card-cat{font-size:11px; font-weight:800; color:var(--gold-500); text-transform:uppercase;}
  .card-title{font-weight:800; font-size:15.5px; color:var(--navy-950);}
  .card-desc{font-size:13px; color:var(--muted); flex:1;}
  .card-footer{display:flex; justify-content:space-between; align-items:center; margin-top:6px;}
  .card-price{font-weight:800; font-size:16px; color:var(--navy-900);}
  .add-btn{
    background:var(--navy-900); color:#fff; border:none; padding:8px 14px; border-radius:7px;
    font-weight:700; font-size:13px; cursor:pointer;
  }
  .out-badge{color:#e74c3c; font-size:12px; font-weight:800;}

  .overlay{position:fixed; inset:0; background:rgba(11,23,48,.5); z-index:100; display:none;}
  .overlay.show{display:block;}
  .drawer{
    position:fixed; top:0; left:0; height:100%; width:min(400px, 92vw); background:#fff;
    z-index:101; transform:translateX(-100%); transition:.3s ease; display:flex; flex-direction:column;
  }
  html[dir="ltr"] .drawer{left:auto; right:0; transform:translateX(100%);}
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .drawer-body{flex:1; overflow-y:auto; padding:16px 20px;}
  .drawer-foot{padding:20px; border-top:1px solid var(--line);}
  .cart-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:center;}
  .cart-item-name{font-weight:700; font-size:14px; flex:1;}
  .qty-controls{display:flex; align-items:center; gap:8px;}
  .qty-controls button{width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer;}
  .remove-x{color:#e74c3c; cursor:pointer; font-size:13px;}
  .total-row{display:flex; justify-content:space-between; font-weight:800; font-size:17px; margin-bottom:14px;}
  .checkout-btn{
    width:100%; background:var(--gold-500); color:var(--navy-950); border:none; padding:14px;
    border-radius:8px; font-weight:800; font-size:15px; cursor:pointer;
  }
  .checkout-form{display:none; flex-direction:column; gap:12px; padding:20px;}
  .checkout-form.show{display:flex;}
  .checkout-form input, .checkout-form textarea{
    padding:11px 13px; border:1px solid var(--line); border-radius:7px; font-family:inherit; font-size:14px;
  }
  .pay-options{display:flex; gap:10px;}
  .pay-options label{flex:1; border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; font-size:13px; font-weight:700; cursor:pointer;}
  .empty-cart{text-align:center; color:var(--muted); padding:40px 0; font-size:14px;}
  .loading{text-align:center; padding:60px; color:var(--muted);}
</style>
</head>
<body>

<header>
  <div class="wrap header-row">
    <div class="brand">
      <img src="logo.png" alt="Albaseet Soft">
      <span data-i18n="storeTitle">متجر Albaseet Soft</span>
    </div>
    <div class="header-right">
      <a href="https://qastlani.github.io/Albassetsoftgambia/" class="back-link" data-i18n="backLink"><i class="fa-solid fa-arrow-right"></i> رجوع للموقع الرئيسي</a>
      <div class="lang-switch">
        <button type="button" class="active" data-lang="ar" onclick="setLang('ar')">AR</button>
        <button type="button" data-lang="en" onclick="setLang('en')">EN</button>
      </div>
      <button class="cart-btn" onclick="openCart()">
        <i class="fa-solid fa-cart-shopping"></i> <span data-i18n="cartLabel">السلة</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="filters" id="filters"></div>
  <div class="grid" id="productsGrid">
    <div class="loading" data-i18n="loadingText">جارِ تحميل المنتجات...</div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <b data-i18n="cartTitle">سلة المشتريات</b>
    <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeCart()"></i>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="checkout-form" id="checkoutForm">
    <input type="text" id="custName" data-i18n-ph="phName" placeholder="الاسم الكامل" required>
    <input type="tel" id="custPhone" data-i18n-ph="phPhone" placeholder="رقم الهاتف" required>
    <textarea id="custAddress" data-i18n-ph="phAddress" placeholder="العنوان بالتفصيل" required></textarea>
    <div class="pay-options">
      <label><input type="radio" name="pay" value="Cash on Delivery" checked> <span data-i18n="payCash">دفع عند الاستلام</span></label>
      <label><input type="radio" name="pay" value="Bank Transfer"> <span data-i18n="payBank">تحويل بنكي</span></label>
    </div>
    <button class="checkout-btn" onclick="submitOrder()" data-i18n="confirmOrder">تأكيد الطلب</button>
  </div>
  <div class="drawer-foot" id="cartFoot">
    <div class="total-row"><span data-i18n="totalLabel">المجموع</span><span id="cartTotal">$0</span></div>
    <button class="checkout-btn" id="goCheckoutBtn" onclick="showCheckout()" data-i18n="checkoutBtn">إتمام الطلب</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ipyafdzrxfwsrenbebad.supabase.co";
const SUPABASE_KEY = "sb_publishable_HeWYWc9kfvT6Anp49jRNvw_creK5A10";
const FORMSPREE_URL = "https://formspree.io/f/mvzevzzy";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let cart = {};
let activeCategory = "all";
let currentLang = "ar";

const translations = {
  storeTitle: {ar:"متجر Albaseet Soft", en:"Albaseet Soft Store"},
  backLink: {ar:"رجوع للموقع الرئيسي", en:"Back to Main Site"},
  cartLabel: {ar:"السلة", en:"Cart"},
  loadingText: {ar:"جارِ تحميل المنتجات...", en:"Loading products..."},
  cartTitle: {ar:"سلة المشتريات", en:"Shopping Cart"},
  phName: {ar:"الاسم الكامل", en:"Full Name"},
  phPhone: {ar:"رقم الهاتف", en:"Phone Number"},
  phAddress: {ar:"العنوان بالتفصيل", en:"Full Address"},
  payCash: {ar:"دفع عند الاستلام", en:"Cash on Delivery"},
  payBank: {ar:"تحويل بنكي", en:"Bank Transfer"},
  confirmOrder: {ar:"تأكيد الطلب", en:"Confirm Order"},
  totalLabel: {ar:"المجموع", en:"Total"},
  checkoutBtn: {ar:"إتمام الطلب", en:"Checkout"},
  allCategory: {ar:"الكل", en:"All"},
  addToCart: {ar:"أضف للسلة", en:"Add to Cart"},
  outOfStock: {ar:"غير متوفر", en:"Out of Stock"},
  emptyCart: {ar:"السلة فارغة", en:"Your cart is empty"},
  noProducts: {ar:"لا يوجد منتجات بهاي الفئة حالياً.", en:"No products in this category yet."},
  fillAllFields: {ar:"الرجاء تعبئة كل الحقول", en:"Please fill in all fields"},
  orderError: {ar:"حدث خطأ، الرجاء المحاولة مرة أخرى أو التواصل عبر واتساب.", en:"Something went wrong. Please try again or contact us via WhatsApp."},
  orderSuccess: {ar:"تم استلام طلبك بنجاح! رح نتواصل معك قريباً لتأكيد التفاصيل.", en:"Your order has been received! We'll contact you shortly to confirm the details."},
  emptyCartAlert: {ar:"السلة فارغة", en:"Your cart is empty"}
};

const pageTitles = { ar: "المتجر | Albaseet Soft Gambia", en: "Store | Albaseet Soft Gambia" };

function setLang(lang){
  currentLang = lang;
  const html = document.getElementById("htmlRoot");
  html.setAttribute("lang", lang);
  html.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  document.getElementById("pageTitle").textContent = pageTitles[lang];

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (translations[key]) el.textContent = translations[key][lang];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const key = el.getAttribute("data-i18n-ph");
    if (translations[key]) el.setAttribute("placeholder", translations[key][lang]);
  });
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
  });

  renderFilters();
  renderProducts();
  updateCartUI();
}

async function loadProducts(){
  const { data, error } = await sb.from("products").select("*").order("id");
  if (error){
    document.getElementById("productsGrid").innerHTML = "<p>Error loading products / حدث خطأ بتحميل المنتجات</p>";
    return;
  }
  products = data;
  renderFilters();
  renderProducts();
}

function renderFilters(){
  const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
  const el = document.getElementById("filters");
  const allLabel = translations.allCategory[currentLang];
  el.innerHTML = `<button class="filter-btn ${activeCategory==='all'?'active':''}" onclick="setCategory('all')">${allLabel}</button>` +
    cats.map(c => `<button class="filter-btn ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join("");
}

function setCategory(c){ activeCategory = c; renderFilters(); renderProducts(); }

function renderProducts(){
  const list = activeCategory === "all" ? products : products.filter(p => p.category === activeCategory);
  const grid = document.getElementById("productsGrid");
  if (list.length === 0){ grid.innerHTML = `<p>${translations.noProducts[currentLang]}</p>`; return; }
  grid.innerHTML = list.map(p => `
    <div class="card">
      <div class="card-img">${p.image_url ? `<img src="${p.image_url}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fa-solid fa-box"></i>'}</div>
      <div class="card-body">
        <div class="card-cat">${p.category || ''}</div>
        <div class="card-title">${p.name}</div>
        <div class="card-desc">${p.description || ''}</div>
        <div class="card-footer">
          <div class="card-price">$${p.price}</div>
          ${p.in_stock === false || p.stock === 0
            ? `<span class="out-badge">${translations.outOfStock[currentLang]}</span>`
            : `<button class="add-btn" onclick="addToCart(${p.id})">${translations.addToCart[currentLang]}</button>`}
        </div>
      </div>
    </div>
  `).join("");
}

function addToCart(id){ cart[id] = (cart[id] || 0) + 1; updateCartUI(); }
function changeQty(id, delta){ cart[id] = (cart[id] || 0) + delta; if (cart[id] <= 0) delete cart[id]; updateCartUI(); }
function removeFromCart(id){ delete cart[id]; updateCartUI(); }

function updateCartUI(){
  const count = Object.values(cart).reduce((a,b) => a+b, 0);
  document.getElementById("cartCount").textContent = count;
  const body = document.getElementById("cartBody");
  const ids = Object.keys(cart);
  if (ids.length === 0){
    body.innerHTML = `<div class="empty-cart">${translations.emptyCart[currentLang]}</div>`;
  } else {
    body.innerHTML = ids.map(id => {
      const p = products.find(pr => pr.id == id);
      if (!p) return '';
      return `
        <div class="cart-item">
          <div class="cart-item-name">${p.name}<br><span style="color:#5b6478;font-size:12.5px;">$${p.price}</span></div>
          <div class="qty-controls">
            <button onclick="changeQty(${id},-1)">-</button>
            <span>${cart[id]}</span>
            <button onclick="changeQty(${id},1)">+</button>
          </div>
          <i class="fa-solid fa-trash remove-x" onclick="removeFromCart(${id})"></i>
        </div>`;
    }).join("");
  }
  const total = ids.reduce((sum, id) => {
    const p = products.find(pr => pr.id == id);
    return sum + (p ? p.price * cart[id] : 0);
  }, 0);
  document.getElementById("cartTotal").textContent = `$${total}`;
}

function openCart(){ document.getElementById("cartDrawer").classList.add("show"); document.getElementById("overlay").classList.add("show"); }
function closeCart(){
  document.getElementById("cartDrawer").classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("checkoutForm").classList.remove("show");
  document.getElementById("cartFoot").style.display = "block";
}
function showCheckout(){
  if (Object.keys(cart).length === 0){ alert(translations.emptyCartAlert[currentLang]); return; }
  document.getElementById("checkoutForm").classList.add("show");
  document.getElementById("cartFoot").style.display = "none";
}

async function submitOrder(){
  const name = document.getElementById("custName").value.trim();
  const phone = document.getElementById("custPhone").value.trim();
  const address = document.getElementById("custAddress").value.trim();
  const payment = document.querySelector('input[name="pay"]:checked').value;

  if (!name || !phone || !address){ alert(translations.fillAllFields[currentLang]); return; }

  const itemsText = Object.keys(cart).map(id => {
    const p = products.find(pr => pr.id == id);
    return `${p.name} x${cart[id]}`;
  }).join(", ");
  const total = Object.keys(cart).reduce((sum, id) => {
    const p = products.find(pr => pr.id == id);
    return sum + (p.price * cart[id]);
  }, 0);

  // 1) Save order to the database
  const { error } = await sb.from("orders").insert([{
    customer_name: name, phone: phone, address: address,
    items: itemsText, total_price: total, payment_method: payment, status: "جديد"
  }]);

  if (error){ alert(translations.orderError[currentLang]); return; }

  // 2) Send an email notification via Formspree (best-effort, does not block success)
  try {
    await fetch(FORMSPREE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        subject: "طلب جديد من المتجر - New Store Order",
        name: name,
        phone: phone,
        address: address,
        items: itemsText,
        total: `$${total}`,
        payment_method: payment
      })
    });
  } catch (e) { /* email notification failed silently, order is already saved */ }

  alert(translations.orderSuccess[currentLang]);
  cart = {};
  updateCartUI();
  closeCart();
}

loadProducts();
</script>
</body>
</html>
